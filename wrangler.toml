# Сервер комнат дуэли «Пульса». Выкладка: см. server/README.md.
name = "pulse-duel"
main = "index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Отчёты «чёрного ящика» (вылеты в Телеграме).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]
